name: Auto Generate SEO Article

on:
  schedule:
    # Runs daily at 01:00 UTC (08:00 WIB)
    - cron: '0 1 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  generate-article:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate SEO Article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-1.5-flas' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH || 'false' }}
          ARTICLE_AUTHOR_NAME: ${{ vars.ARTICLE_AUTHOR_NAME || 'comfindo Management' }}
        run: npx tsx scripts/generate-seo-article.ts

      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changes_exist=true" >> $GITHUB_ENV
          else
            echo "changes_exist=false" >> $GITHUB_ENV
          fi

      - name: Commit and Push changes
        if: env.changes_exist == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/article-topics.json
          git add content/blog/ || true
          git commit -m "chore: auto-generated SEO article and updated topic status [skip ci]"
          git push
